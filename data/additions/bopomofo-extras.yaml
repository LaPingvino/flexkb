name: Bopomofo extras (compound vowels + zh/ch/sh + tone marks)
description: |
  Same trick as russian-phonetic-extras: fill in the Bopomofo symbols
  that don't have a single-Latin-letter cognate.

  - Compound vowels at fixed punctuation positions (number row at level 3
    to keep digits intact at level 1+2)
  - zh/ch/sh on TLDE / BKSL / AC11 (positions a Pinyin typist would
    reach for these multi-character sounds)
  - Tone marks on AltGr+1234

  Stack on QWERTY + latin-to-bopomofo for a workable Pinyin-to-Bopomofo
  experience: cognate consonants come from the substitution, compound
  forms come from this addition. Not a full IME — for Mandarin syllable
  + tone composition, pair with ibus-chewing.
overlays:
  TLDE: { levels: ["", "", U3113, U3115] }  # AltGr → ㄓ (zh), Shift → ㄕ
  AE01: { levels: ["1", exclam, U02C7, U02D9] }   # ˇ (3rd tone), ˙ (light)
  AE02: { levels: ["2", at, U02CA, U02CB] }       # ˊ (2nd tone), ˋ (4th)
  AE03: { levels: ["3", numbersign, U311E, U311E] }   # ㄞ ai
  AE04: { levels: ["4", dollar, U311F, U311F] }       # ㄟ ei
  AE05: { levels: ["5", percent, U3120, U3120] }      # ㄠ ao
  AE06: { levels: ["6", asciicircum, U3121, U3121] }  # ㄡ ou
  AE07: { levels: ["7", ampersand, U3122, U3122] }    # ㄢ an
  AE08: { levels: ["8", asterisk, U3123, U3123] }     # ㄣ en
  AE09: { levels: ["9", parenleft, U3124, U3124] }    # ㄤ ang
  AE10: { levels: ["0", parenright, U3125, U3125] }   # ㄥ eng
  AE11: { levels: [minus, underscore, U3126, U3126] } # ㄦ er
  AE12: { levels: [equal, plus, U311D, U311D] }       # ㄝ ie/e
  AC11: { levels: [apostrophe, quotedbl, U3115, U3114] } # ㄕ sh, ㄔ ch
  BKSL: { levels: [backslash, bar, U3114, U3114] }    # ㄔ ch
includes:
  - level3(ralt_switch)
