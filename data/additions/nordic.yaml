name: Nordic letters (Æ/Ø/Å, Ä/Ö/Å)
description: |
  Nordic-language letter overlay — æ/ø/å for Danish/Norwegian, ä/ö/å for
  Swedish/Finnish. Compose with QWERTY/Dvorak/Colemak. Per the convention
  most Nordic keyboards use, the letters sit on AC10/AC11/AD11 — same
  positions as German umlauts but with different glyphs.
overlays:
  AD11: { levels: [aring, Aring] }
  AC10: { levels: [oslash, Oslash] }
  AC11: { levels: [ae, AE] }
includes:
  - level3(ralt_switch)
