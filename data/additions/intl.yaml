name: International (dead keys + letter accents)
description: |
  US-international addition. Two halves: position-based dead keys on the
  punctuation slots (TLDE/AE06/AE09/AC11/etc.), and letter-following
  accent overlays so the accented form of 'q' goes wherever 'q' lives,
  regardless of base transformation. The same file therefore produces
  the correct intl variant on QWERTY (us-intl), Dvorak (us-dvorak-intl),
  Colemak, Workman, Norman — one addition, every base.

# nudge merge mode is the spine of intl's cross-base behaviour. Every
# overlay below uses nudge semantics: if the base transformation
# already occupies a slot, the overlay slides up to the first empty
# level rather than clobbering. On QWERTY (where TLDE L1/L2 are grave/
# asciitilde and AC11 L1/L2 are apostrophe/quotedbl) you get the
# traditional us-intl layout. On AZERTY (where AE06 L2 is the digit
# "6" and AE04 L1 is apostrophe) the digit row and punctuation are
# preserved and the dead keys arrive at AltGr instead. One addition,
# every Latin base, no clobber.
mode: nudge
overlays:
  # Classic us-intl dead-key positions. On QWERTY these land at L1/L2
  # because TLDE/AE-row L1/L2 are mostly non-alphabetic; on AZERTY the
  # digit row holds L2 so the dead keys slide up to L3/L4 via nudge.
  TLDE: { levels: [dead_grave, dead_tilde, dead_grave, dead_tilde] }
  AE01: { levels: ["", "", exclamdown, onesuperior] }
  AE02: { levels: ["", "", twosuperior, dead_doubleacute] }
  AE03: { levels: ["", "", threesuperior, dead_macron] }
  AE04: { levels: ["", "", currency, sterling] }
  AE05: { levels: ["", "", EuroSign, dead_cedilla] }
  AE06: { levels: ["", "", dead_circumflex, asciicircum] }
  AE07: { levels: ["", "", onehalf, dead_horn] }
  AE08: { levels: ["", "", threequarters, dead_ogonek] }
  AE09: { levels: ["", "", leftsinglequotemark, dead_breve] }
  AE10: { levels: ["", "", rightsinglequotemark, dead_abovering] }
  BKSL: { levels: ["", "", notsign, brokenbar] }

# Letter-following accent overlays. The level-1 letter is the lookup key;
# levels 3 and 4 (AltGr and AltGr+Shift) get the accented forms. Applied
# AFTER position overlays, so an addition can override a position then
# decorate per-letter.
letter_overlays:
  q: { levels: ["", "", adiaeresis, Adiaeresis] }
  w: { levels: ["", "", aring, Aring] }
  e: { levels: ["", "", eacute, Eacute] }
  r: { levels: ["", "", registered, trademark] }
  t: { levels: ["", "", thorn, THORN] }
  y: { levels: ["", "", udiaeresis, Udiaeresis] }
  u: { levels: ["", "", uacute, Uacute] }
  i: { levels: ["", "", iacute, Iacute] }
  o: { levels: ["", "", oacute, Oacute] }
  p: { levels: ["", "", odiaeresis, Odiaeresis] }
  a: { levels: ["", "", aacute, Aacute] }
  s: { levels: ["", "", ssharp, section] }
  d: { levels: ["", "", eth, ETH] }
  f: { levels: ["", "", ediaeresis, Ediaeresis] }
  j: { levels: ["", "", idiaeresis, Idiaeresis] }
  k: { levels: ["", "", oe, OE] }
  l: { levels: ["", "", oslash, Oslash] }
  z: { levels: ["", "", ae, AE] }
  x: { levels: ["", "", periodcentered, dead_stroke] }
  c: { levels: ["", "", copyright, cent] }
  n: { levels: ["", "", ntilde, Ntilde] }
  m: { levels: ["", "", mu, plusminus] }
  # Punctuation tokens — these are also letter-following so dead_abovedot
  # tracks the period key whether you're on QWERTY (period on AB09) or
  # Dvorak (period on AD03). This is how the user's existing "AltGr+period,
  # then i = ı / dead_abovedot on I = İ" muscle memory keeps working
  # across transformations.
  #
  # Each entry below uses mode: nudge — the punctuation L1/L2 from the
  # base transformation is preserved; intl's overlay levels slide up to
  # the first empty slot. On QWERTY apostrophe (AC11 = [apostrophe,
  # quotedbl]) you get [apostrophe, quotedbl, dead_acute, dead_diaeresis]
  # — apostrophe key still types an apostrophe, dead_acute on AltGr.
  # On AZERTY (AE04 = [apostrophe, "4"]) you get [apostrophe, "4",
  # dead_acute, dead_diaeresis] — digit row preserved. On both bases
  # AltGr+' produces dead_acute, AltGr+Shift+' produces dead_diaeresis.
  apostrophe:   { levels: [dead_acute, dead_diaeresis, apostrophe, quotedbl], fallback: [ugrave, eacute], mode: nudge }
  semicolon:    { levels: ["", "", paragraph, degree], fallback: [comma, m], mode: nudge }
  comma:        { levels: [comma, less, ccedilla, Ccedilla], fallback: [semicolon], mode: nudge }
  period:       { levels: [period, greater, dead_abovedot, dead_caron], fallback: [semicolon, comma], mode: nudge }
  slash:        { levels: [slash, question, questiondown, dead_hook], fallback: [exclam, colon], mode: nudge }
  minus:        { levels: [minus, underscore, yen, dead_belowdot], fallback: [parenright, equal], mode: nudge }
  bracketleft:  { levels: ["", "", guillemotleft, leftdoublequotemark], fallback: [parenleft, dollar], mode: nudge }
  bracketright: { levels: ["", "", guillemotright, rightdoublequotemark], fallback: [parenright, asterisk], mode: nudge }

includes:
  - level3(ralt_switch)
