name: International (dead keys + letter accents)
description: |
  US-international addition. Two halves: position-based dead keys on the
  punctuation slots (TLDE/AE06/AE09/AC11/etc.), and letter-following
  accent overlays so the accented form of 'q' goes wherever 'q' lives,
  regardless of base transformation. The same file therefore produces
  the correct intl variant on QWERTY (us-intl), Dvorak (us-dvorak-intl),
  Colemak, Workman, Norman — one addition, every base.

# Position-based level 3/4 decorations. Levels 1 and 2 are left empty
# (pass-through) so the underlying transformation's keys aren't clobbered
# — that's how intl can compose cleanly on Dvorak, which puts brackets on
# AE11/AE12 where QWERTY has minus/equal. TLDE keeps a position-based
# dead_grave on level 1 because every Latin transformation has grave/
# asciitilde there; AE06 keeps dead_circumflex on level 2 because every
# Latin transformation has asciicircum at level 2 of AE06.
overlays:
  TLDE: { levels: [dead_grave, dead_tilde, grave, asciitilde] }
  AE01: { levels: ["", "", exclamdown, onesuperior] }
  AE02: { levels: ["", "", twosuperior, dead_doubleacute] }
  AE03: { levels: ["", "", threesuperior, dead_macron] }
  AE04: { levels: ["", "", currency, sterling] }
  AE05: { levels: ["", "", EuroSign, dead_cedilla] }
  AE06: { levels: ["", dead_circumflex, onequarter, asciicircum] }
  AE07: { levels: ["", "", onehalf, dead_horn] }
  AE08: { levels: ["", "", threequarters, dead_ogonek] }
  AE09: { levels: ["", "", leftsinglequotemark, dead_breve] }
  AE10: { levels: ["", "", rightsinglequotemark, dead_abovering] }
  BKSL: { levels: ["", "", notsign, brokenbar] }

# Letter-following accent overlays. The level-1 letter is the lookup key;
# levels 3 and 4 (AltGr and AltGr+Shift) get the accented forms. Applied
# AFTER position overlays, so an addition can override a position then
# decorate per-letter.
letter_overlays:
  q: { levels: ["", "", adiaeresis, Adiaeresis] }
  w: { levels: ["", "", aring, Aring] }
  e: { levels: ["", "", eacute, Eacute] }
  r: { levels: ["", "", registered, trademark] }
  t: { levels: ["", "", thorn, THORN] }
  y: { levels: ["", "", udiaeresis, Udiaeresis] }
  u: { levels: ["", "", uacute, Uacute] }
  i: { levels: ["", "", iacute, Iacute] }
  o: { levels: ["", "", oacute, Oacute] }
  p: { levels: ["", "", odiaeresis, Odiaeresis] }
  a: { levels: ["", "", aacute, Aacute] }
  s: { levels: ["", "", ssharp, section] }
  d: { levels: ["", "", eth, ETH] }
  f: { levels: ["", "", ediaeresis, Ediaeresis] }
  j: { levels: ["", "", idiaeresis, Idiaeresis] }
  k: { levels: ["", "", oe, OE] }
  l: { levels: ["", "", oslash, Oslash] }
  z: { levels: ["", "", ae, AE] }
  x: { levels: ["", "", periodcentered, dead_stroke] }
  c: { levels: ["", "", copyright, cent] }
  n: { levels: ["", "", ntilde, Ntilde] }
  m: { levels: ["", "", mu, plusminus] }
  # Punctuation tokens — these are also letter-following so dead_abovedot
  # tracks the period key whether you're on QWERTY (period on AB09) or
  # Dvorak (period on AD03). This is how the user's existing "AltGr+period,
  # then i = ı / dead_abovedot on I = İ" muscle memory keeps working
  # across transformations.
  apostrophe:   { levels: [dead_acute, dead_diaeresis, apostrophe, quotedbl] }
  semicolon:    { levels: ["", "", paragraph, degree] }
  comma:        { levels: [comma, less, ccedilla, Ccedilla] }
  period:       { levels: [period, greater, dead_abovedot, dead_caron] }
  slash:        { levels: [slash, question, questiondown, dead_hook] }
  minus:        { levels: [minus, underscore, yen, dead_belowdot] }
  bracketleft:  { levels: ["", "", guillemotleft, leftdoublequotemark] }
  bracketright: { levels: ["", "", guillemotright, rightdoublequotemark] }

includes:
  - level3(ralt_switch)
