name: ASCII i/I pairing on Turkish base (swap-style)
description: |
  Inverse of turkish-i-pair. Applies on top of a Turkish base (Turkish-Q
  or Turkish-F). Rather than hide İ behind AltGr, this performs a
  symmetric SWAP of the two i-key shifted targets — since the Turkish
  base already has separate i and ı keys, both case forms remain on
  Shift, just on different keys:

    Original Turkish:   Shift+i → İ,   Shift+ı → I
    With this addition: Shift+i → I,   Shift+ı → İ

  Result: English typists get the muscle memory they expect (Shift+i
  produces ASCII I) without losing access to İ (now on Shift+ı). The
  pair-of-files pattern still gives the explicit "inverse toggle" the
  user requested.
letter_overlays:
  # Both overlays priority:low — this addition is meaningful only when
  # composed on a Turkish base that actually has these keys. On any other
  # base the overlays silently yield, so layering [english-i-on-turkish]
  # on, say, plain QWERTY is a no-op rather than a noisy failure.
  i:        { levels: ["", I], priority: low }
  idotless: { levels: ["", Iabovedot], priority: low }
includes:
  - level3(ralt_switch)
