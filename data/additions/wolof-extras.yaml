name: Wolof extras (ŋ ɓ ɗ ñ on AltGr)
description: |
  Wolof uses a handful of letters beyond standard Latin: ŋ (eng), ñ
  (n-tilde), ɓ (implosive b — U0253), ɗ (implosive d — U0257), and
  optionally ƴ (implosive y — U01B4). Letter-following so they track
  the underlying Latin cognates regardless of QWERTY/AZERTY/Dvorak base.

  Stack on top of azerty + french-accents for the standard
  Senegalese (Wolof on AZERTY) keyboard.
letter_overlays:
  n: { levels: ["", "", eng, ENG] }
  b: { levels: ["", "", U0253, U0181] }
  d: { levels: ["", "", U0257, U018A] }
  y: { levels: ["", "", U01B4, U01B3] }
  # ñ on AltGr+m as a less obvious slot — n is already eng
  m: { levels: ["", "", ntilde, Ntilde] }
includes:
  - level3(ralt_switch)
