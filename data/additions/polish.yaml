name: Polish (programmers')
description: |
  Polish letter-following overlay. Each Polish diacritic sits at the
  AltGr layer of the underlying-Latin-letter position: AltGr+a → ą,
  AltGr+e → ę, etc. Works for QWERTY, Dvorak, Colemak, Workman, Norman
  — the diacritics track wherever the underlying letter happens to be.

  Polish keyboard layouts use the QWERTY convention of ź on the X-key
  position (not Z), so the overlay maps x → ź even though etymologically
  it's z with acute. Users typing on Polish QWERTY hardware know AltGr+X
  is ź; on Dvorak/Colemak the same gesture follows whatever key X is on.
letter_overlays:
  a: { levels: ["", "", aogonek, Aogonek] }
  c: { levels: ["", "", cacute, Cacute] }
  e: { levels: ["", "", eogonek, Eogonek] }
  l: { levels: ["", "", lstroke, Lstroke] }
  n: { levels: ["", "", nacute, Nacute] }
  o: { levels: ["", "", oacute, Oacute] }
  s: { levels: ["", "", sacute, Sacute] }
  z: { levels: ["", "", zabovedot, Zabovedot] }
  x: { levels: ["", "", zacute, Zacute] }
includes:
  - level3(ralt_switch)
