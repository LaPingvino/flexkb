name: Thaana (Dhivehi, Maldivian — RTL)
script: thaana
description: |
  Native Maldivian (Dhivehi) keyboard arrangement. Thaana is a right-to-
  left script U0780-U07BF, unique to the Maldives. Positional layout
  from xkb's mv/basic.
keys:
  TLDE: { levels: [grave, asciitilde] }
  AE01: { levels: ["1", exclam] }
  AE02: { levels: ["2", at] }
  AE03: { levels: ["3", numbersign] }
  AE04: { levels: ["4", dollar] }
  AE05: { levels: ["5", percent] }
  AE06: { levels: ["6", asciicircum] }
  AE07: { levels: ["7", ampersand] }
  AE08: { levels: ["8", asterisk] }
  AE09: { levels: ["9", parenleft] }
  AE10: { levels: ["0", parenright] }
  AE11: { levels: [minus, underscore] }
  AE12: { levels: [equal, plus] }

  AD01: { levels: [U07B0, U07A4] }
  AD02: { levels: [U0787, U07A2] }
  AD03: { levels: [U07AC, U07AD] }
  AD04: { levels: [U0783, U079C] }
  AD05: { levels: [U078C, U0793] }
  AD06: { levels: [U0794, U07A0] }
  AD07: { levels: [U07AA, U07AB] }
  AD08: { levels: [U07A8, U07A9] }
  AD09: { levels: [U07AE, U07AF] }
  AD10: { levels: [U0795, division] }
  AD11: { levels: [bracketleft, braceleft] }
  AD12: { levels: [bracketright, braceright] }

  AC01: { levels: [U07A6, U07A7] }
  AC02: { levels: [U0790, U0781] }
  AC03: { levels: [U078B, U0791] }
  AC04: { levels: [U078A, Ufdf2] }
