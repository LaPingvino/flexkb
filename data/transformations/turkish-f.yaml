name: Turkish F
description: |
  Turkish F — designed in the 1950s with Turkish letter frequency analysis;
  vowels on right hand, frequent consonants on left. Modern Turkish
  keyboards usually ship with the Q (QWERTY-based) layout, but F is the
  ergonomically optimised native arrangement.
