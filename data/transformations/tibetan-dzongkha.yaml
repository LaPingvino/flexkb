name: Tibetan (Dzongkha standard)
script: tibetan
description: |
  Native Tibetan/Dzongkha positional layout. Tibetan is Brahmic-family
  but uses subscript-form consonants (U0F90-U0FBF) instead of virama-
  based clustering, so it doesn't fit the InScript template cleanly —
  shipping its own dedicated transformation rather than as an inscript
  resolution substitution.

  Levels: 1 = primary consonant/vowel, 2 = subscript form (shift),
  3+ = less-common diacritics + brackets. Pair with level3(ralt_switch).
