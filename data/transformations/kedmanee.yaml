name: Kedmanee (Thai)
script: thai
description: |
  Native Thai keyboard layout — Kedmanee, the de-facto Thai arrangement.
  Consonants on the left side, vowels and tone marks on the right. Thai
  has no upper/lowercase distinction; level 2 (Shift) gives less-frequent
  characters and tone marks.
keys:
