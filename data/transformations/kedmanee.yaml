  AE01: { levels: [Thai_lakkhangyao, plus] }
  AE02: { levels: [slash, Thai_leknung] }
  AE03: { levels: [minus, Thai_leksong] }
  AE04: { levels: [Thai_phosamphao, Thai_leksam] }
  AE05: { levels: [Thai_thothung, Thai_leksi] }
  AE06: { levels: [Thai_sarau, Thai_sarauu] }
