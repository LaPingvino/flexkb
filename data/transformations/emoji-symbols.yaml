name: Emoji (Symbols)
description: |
  Symbols, hearts, sparkles, marks, signs, religious symbols, currency
  symbols (the picture ones), and miscellaneous useful pictographs.
  4 levels per key.

  Same "switch-to-emoji-mode" UX as emoji(faces). Pair with a
  compositor group-switch hotkey for quick layer toggling.
script: emoji
