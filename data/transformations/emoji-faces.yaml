name: Emoji (Faces)
description: |
  Each key carries 4 smileys/emotion emoji across all levels — base,
  Shift, AltGr, AltGr+Shift — since emoji have no case distinction.
  ~190 emoji on a single layout. Curated for emotion progression:
  top row digits = happy spectrum, alphabet rows = neutral / playful /
  sad / surprised, bottom row = irritated / mischievous / monsters.

  Intended use: switch to this as a temporary input layer via a
  compositor group-switch hotkey, type the emoji, switch back. Or set
  permanently and use AltGr / Shift modifiers to navigate the grid.
script: emoji
