name: Turkish Q
description: |
  Turkish Q — QWERTY-based with Turkish letters dropped in: ı (idotless),
  ş, ğ, ü, ö, ç replace specific punctuation/letter slots. Common default
  on Turkish PCs since the Q-layout era.
keys:
  TLDE: { levels: [quotedbl, eacute] }
  AE01: { levels: ["1", exclam] }
  AE02: { levels: ["2", apostrophe] }
  AE03: { levels: ["3", asciicircum] }
  AE04: { levels: ["4", plus] }
  AE05: { levels: ["5", percent] }
  AE06: { levels: ["6", ampersand] }
  AE07: { levels: ["7", slash] }
  AE08: { levels: ["8", parenleft] }
  AE09: { levels: ["9", parenright] }
  AE10: { levels: ["0", equal] }
  AE11: { levels: [asterisk, question] }
  AE12: { levels: [minus, underscore] }

  AD01: { levels: [q, Q] }
  AD02: { levels: [w, W] }
  AD03: { levels: [e, E] }
  AD04: { levels: [r, R] }
  AD05: { levels: [t, T] }
  AD06: { levels: [y, Y] }
  AD07: { levels: [u, U] }
  AD08: { levels: [idotless, I] }
  AD09: { levels: [o, O] }
  AD10: { levels: [p, P] }
  AD11: { levels: [gbreve, Gbreve] }
  AD12: { levels: [udiaeresis, Udiaeresis] }

  AC01: { levels: [a, A] }
  AC02: { levels: [s, S] }
  AC03: { levels: [d, D] }
  AC04: { levels: [f, F] }
  AC05: { levels: [g, G] }
  AC06: { levels: [h, H] }
  AC07: { levels: [j, J] }
  AC08: { levels: [k, K] }
  AC09: { levels: [l, L] }
  AC10: { levels: [scedilla, Scedilla] }
  AC11: { levels: [i, Iabovedot] }
  BKSL: { levels: [comma, semicolon] }

  LSGT: { levels: [less, greater] }
  AB01: { levels: [z, Z] }
  AB02: { levels: [x, X] }
  AB03: { levels: [c, C] }
  AB04: { levels: [v, V] }
  AB05: { levels: [b, B] }
  AB06: { levels: [n, N] }
  AB07: { levels: [m, M] }
  AB08: { levels: [odiaeresis, Odiaeresis] }
  AB09: { levels: [ccedilla, Ccedilla] }
  AB10: { levels: [period, colon] }
