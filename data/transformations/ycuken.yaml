name: ЙЦУКЕН
description: |
  Native Russian keyboard arrangement — Cyrillic letters at their
  traditional positions on a Russian typewriter / computer keyboard.
  This is to Russian what QWERTY is to English: the de-facto standard
  arrangement, not a phonetic mapping. Apply on top of a physical to
  get a Russian native layout; no substitution needed.
