  Animals, plants, weather, landscapes. 4 levels per key — roughly
  organised by taxonomy: top row = mammals + pets, middle = birds /
  reptiles / sea life, bottom = plants + weather + landscape.

  Same switch-to-emoji-mode UX as the other emoji variants.
