name: N'Ko (Guinea, RTL West African)
script: nko
description: |
  N'Ko script (U07C0-U07FF) — used for Manding languages (Bambara,
  Maninka, Dyula). Right-to-left like Arabic/Hebrew. Designed by
  Solomana Kanté in 1949.

  Native positional layout from Guinea's xkb gn/basic. Pair with the
  arabic-101 / hebrew-style RTL handling at xkb runtime.
