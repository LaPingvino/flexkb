  AC06: { levels: [kana_KU, h] }
  AC07: { levels: [kana_MA, j] }
  AC08: { levels: [kana_NO, k] }
  AC09: { levels: [kana_RI, l] }
  AC10: { levels: [kana_RE, semicolon] }
  AC11: { levels: [kana_KE, apostrophe] }
  BKSL: { levels: [kana_RO, backslash] }

  AB01: { levels: [kana_TSU, kana_tsu] }
