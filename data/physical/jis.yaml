name: JIS
description: |
  109-key JIS shell — Japanese layout. Adds AB11 (Yen/backslash key right
  of M), plus MUHE/HENK/HKTG keys that aren't expressible in pure
  alphanumeric form; we only model the alphanumeric-relevant subset here.
keys: [
  TLDE,
  AE01, AE02, AE03, AE04, AE05, AE06, AE07, AE08, AE09, AE10, AE11, AE12, AE13,
  AD01, AD02, AD03, AD04, AD05, AD06, AD07, AD08, AD09, AD10, AD11, AD12,
  AC01, AC02, AC03, AC04, AC05, AC06, AC07, AC08, AC09, AC10, AC11,
  BKSL,
  AB01, AB02, AB03, AB04, AB05, AB06, AB07, AB08, AB09, AB10, AB11,
]
