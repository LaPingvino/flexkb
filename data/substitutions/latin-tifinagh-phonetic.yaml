name: Latin → Tifinagh (phonetic / Berber)
description: |
  Phonetic Tifinagh substitution for typing Berber/Tamazight. Tifinagh
  (U2D30-U2D7F) is the indigenous Berber script, used in Morocco and
  Algeria. Maps Latin letters to their Tifinagh consonant cognates.
map:
  a: U2D30   # ⴰ
  A: U2D30
  b: U2D31   # ⴱ
  B: U2D31
  c: U2D33   # ⴳ (g sound)
  C: U2D33
  d: U2D37   # ⴷ
  D: U2D38   # ⴸ
  e: U2D3B   # ⴻ
  E: U2D3B
  f: U2D3C   # ⴼ
  F: U2D3C
  g: U2D33   # ⴳ
  G: U2D33
  h: U2D49   # ⵉ (vowel i, used as h sometimes)
  H: U2D49
  i: U2D49   # ⵉ
