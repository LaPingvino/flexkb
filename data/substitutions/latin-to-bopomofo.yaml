name: Latin → Bopomofo (naive phonetic — decorative output only)
description: |
  CAVEAT: This is a naive single-letter cognate mapping, NOT the standard
  Taiwanese Da-Chen Bopomofo keyboard layout (which is positional, not
  phonetic) and NOT Pinyin input (which works at syllable level —
  "wo" → ㄨㄛ doesn't match w→ㄨ + o→ㄛ at the keyboard level).

  Real Bopomofo input wants either:
  - A positional bopomofo-dachen.yaml transformation (TODO — would
    follow the same pattern as Kedmanee for Thai), or
  - An IME like ibus-chewing / fcitx5-chewing for Pinyin→Bopomofo
    syllable composition with tone marks.

  This substitution is useful only for "decorative phonetic output" —
  showing rough Bopomofo-like glyphs for Latin text. Not a real input
  method.
map:
  b: U3105   # ㄅ
  B: U3105
  p: U3106   # ㄆ
  P: U3106
  m: U3107   # ㄇ
  M: U3107
