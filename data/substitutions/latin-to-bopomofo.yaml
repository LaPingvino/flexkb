name: Latin → Bopomofo (Mandarin phonetic / Zhuyin)
description: |
  Maps each Latin letter to its Bopomofo (Zhuyin / 注音符號) cognate.
  Bopomofo (U3100-U312F) is Taiwan's phonetic input system for Mandarin.
  Each symbol = one Mandarin sound (consonant or vowel).

  Single-letter approximation — Bopomofo's multi-letter combos like
  zh/ch/sh can't be expressed by per-letter substitution. For full
  Bopomofo input (with multi-char composition + tone marks), an IME
  like ibus-chewing or fcitx5-chewing is the practical path.

  Compose on QWERTY for the standard Bopomofo positions on a typical
  Taiwanese keyboard layout.
map:
