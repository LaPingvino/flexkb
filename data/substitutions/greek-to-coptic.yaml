name: Greek → Coptic (chained on top of Greek phonetic)
description: |
  Coptic descended from Greek and shares most letter shapes. This
  substitution maps Greek letters to their Coptic cognates (U2C80-U2CFF
  Coptic block, or U03E2-U03EF for the few Coptic-specific letters in
  the Greek block).

  Chain AFTER latin-greek-phonetic to get Coptic via Latin input:
    substitutions: [latin-greek-phonetic, greek-to-coptic]

  Coptic also has 6 letters borrowed from Demotic (ϣ Shei, ϥ Fei,
  ϧ Khei, ϩ Hori, ϫ Janja, ϭ Cima, ϯ Ti) which Greek doesn't have —
  those would need additional substitutions/additions.
