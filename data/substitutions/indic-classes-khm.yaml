name: Indic class tokens → Khmer codepoints
description: |
  Khmer resolution for the InScript template. Khmer is Brahmic-family
  (descended from Pallava) and has rich consonant + vowel categories
  that map cleanly to InScript classes. Native Khmer users should
  prefer kh/basic; this variant exists for InScript-trained typists.
