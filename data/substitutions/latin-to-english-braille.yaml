name: Latin → English Braille (Grade 1, uncontracted)
description: |
  Substitutes each Latin letter for its English Braille Grade 1 cell
  (Unicode Braille Patterns block U2800-U28FF). Compose on any Latin
  transformation to produce Braille text output from regular typing —
  useful for sighted users producing Braille documents.

  Grade 1 only; Grade 2 contractions (word-level shortenings like "the"
  → ⠮) need a translation library like liblouis and can't be done by
  per-letter substitution.

  Together with the existing `braille-home-row` transformation, flexkb
  now serves both directions:
   - Braille INPUT (chord on 8 keys): braille-home-row transformation,
     translated to target-language letters by brltty/liblouis externally
   - Braille OUTPUT (Latin → Braille glyphs): this substitution
