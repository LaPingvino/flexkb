name: Indic class tokens → Bengali codepoints
description: |
  Bengali (Bangla) resolution for the InScript template. Same physical
  positions as Devanagari InScript, different codepoints. A user who
  knows InScript Devanagari can switch to Bengali via this substitution
  and keep their muscle memory.
