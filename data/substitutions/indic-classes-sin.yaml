name: Indic class tokens → Sinhala codepoints
description: |
  Sinhala (used in Sri Lanka) resolution for the InScript template.
  Sinhala is part of the Brahmic family — same positional template
  applies. The BIS IS 13194 InScript spec lists Sinhalese explicitly
  as one of the supported scripts.
