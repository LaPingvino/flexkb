name: Cyrillic → Russian Braille (Grade 1)
description: |
  Maps Russian Cyrillic letters to their Russian Braille cells. Chain
  AFTER latin-cyrillic-phonetic (or apply on top of ycuken native input)
  to get Russian Braille output:

    substitutions: [latin-cyrillic-phonetic, cyrillic-to-russian-braille]

  Letters with Latin cognates (а/b/в/г/etc.) reuse the same Braille
  cells as English Braille; uniquely-Russian letters (й/ш/ъ/ы/ь/э/ю/я)
  get their own conventional cells.
map:
  Cyrillic_a:        U2801   # ⠁
  Cyrillic_A:        U2801
  Cyrillic_be:       U2803   # ⠃
  Cyrillic_BE:       U2803
  Cyrillic_ve:       U283A   # ⠺
  Cyrillic_VE:       U283A
  Cyrillic_ghe:      U281B   # ⠛
