name: Latin → Thai (phonetic)
description: |
  Phonetic Thai substitution. Each Latin letter maps to its closest Thai
  consonant or vowel by sound. There's no single standard convention —
  this follows common romanization (RTGS-ish):

    k → ก   kh → ข,ค   ng → ง   c → จ   ch → ฉ,ช   s → ซ,ส
    y → ย   d → ด,ฎ   t → ต,ฏ   th → ท,ฐ   n → น,ณ
    b → บ   p → ป   ph → ผ,พ   f → ฟ   m → ม   r → ร
    l → ล   w → ว   h → ห   a → อ,ะ   i → อิ   u → อุ
    e → เ   o → โ

  Since flexkb substitutions are character-level (not multi-char), we use
  the single-letter cognate for each Latin letter; multi-char romaniz-
  ations like "kh" or "th" can't be expressed this way — users wanting
  full Thai input should pair with an IME, or use the native Kedmanee
  layout via th/basic.
