name: Cyrillic → Glagolitic (chained for Old Slavic)
description: |
  Glagolitic is the older Slavic alphabet (devised by Cyril ~860 CE),
  later displaced by Cyrillic. Same phonemes, different glyphs.
  Chain AFTER latin-cyrillic-phonetic to type Glagolitic via Latin
  phonetic input:
    substitutions: [latin-cyrillic-phonetic, cyrillic-to-glagolitic]

  Glagolitic block: U2C00-U2C5F.
