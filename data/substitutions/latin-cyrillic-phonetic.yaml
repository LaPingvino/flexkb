name: Latin → Cyrillic (phonetic)
description: |
  Phonetic substitution: each Latin letter maps to its Cyrillic cognate.
  Apply over any Latin transformation (QWERTY, Dvorak, Colemak, Workman…)
  to get a Russian-phonetic layout that follows the underlying letter
  positions. Use ~latin-cyrillic-phonetic for the inverse direction
  (Cyrillic muscle memory typing Latin text).

  Convention follows the Russian phonetic mapping used by xkb's
  ru(phonetic): w collides onto Cyrillic_ve (same as v) and x onto
  Cyrillic_softsign — both are non-cognate slots needing a home.
map:
  a: Cyrillic_a
  A: Cyrillic_A
  b: Cyrillic_be
  B: Cyrillic_BE
  c: Cyrillic_tse
  C: Cyrillic_TSE
