name: Latin → Syriac (phonetic)
description: |
  Phonetic Syriac substitution. Syriac (Aramaic script, U0700-U074F) is
  the third major Semitic abjad alongside Arabic and Hebrew, used for
  Classical Syriac liturgy and modern Neo-Aramaic dialects.

  22 root Proto-Semitic consonants — same set as Hebrew. Maps follow
  the Hebrew phonetic conventions where they overlap.
