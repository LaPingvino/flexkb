name: Latin → Armenian (phonetic)
description: |
  Phonetic Armenian substitution. Each Latin letter maps to its closest
  Armenian cognate. Apply over any Latin transformation to type Armenian
  via AltGr+sound. Convention follows the Armenian phonetic xkb variant.
