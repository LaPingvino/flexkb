name: Devanagari → Bharati Braille (Grade 1)
description: |
  Maps Devanagari letters to Bharati Braille cells. Bharati Braille is
  the unified Indian Braille standard, designed to work across all
  Indic scripts. Chain after latin-devanagari-phonetic (or apply to
  Hindi InScript output) to produce Hindi Braille glyphs.
