name: Latin → Hebrew (phonetic)
description: |
  Phonetic Hebrew substitution. Apply over any Latin transformation to get
  a Hebrew-phonetic layout that follows the Latin letter positions
  underneath. Several letters have multiple sound-cognates; we pick the
  most common convention (a→aleph, b→bet, c→tsade-or-kaph — we go kaph
  since "c" is /k/-like in English).
