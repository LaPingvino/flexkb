name: Indic class tokens → Tamil codepoints
description: |
  Tamil resolution for the InScript template. Tamil has fewer letters
  than Devanagari (no voicing distinctions, no aspirates) — multiple
  class tokens collapse to the same Tamil letter.
map:
  indic_v_a:           U0B85   # அ
  indic_v_aa:          U0B86   # ஆ
  indic_v_i:           U0B87   # இ
  indic_v_ii:          U0B88   # ஈ
  indic_v_u:           U0B89   # உ
  indic_v_uu:          U0B8A   # ஊ
  indic_v_e:           U0B8F   # ஏ
  indic_v_e_short:     U0B8E   # எ
  indic_v_ai:          U0B90   # ஐ
  indic_v_o:           U0B93   # ஓ
  indic_v_o_short:     U0B92   # ஒ
  indic_v_au:          U0B94   # ஔ
  indic_v_r:           U0B85
  indic_v_l:           U0B85
  indic_v_candra_e:    U0B8F
  indic_v_candra_e_alt: U0BC7
  indic_v_o_candra:    U0B93

  indic_m_aa:          U0BBE   # ா
  indic_m_i:           U0BBF   # ி
  indic_m_ii:          U0BC0   # ீ
  indic_m_u:           U0BC1   # ு
  indic_m_uu:          U0BC2   # ூ
  indic_m_e:           U0BC7   # ே
  indic_m_e_short:     U0BC6   # ெ
  indic_m_ai:          U0BC8   # ை
  indic_m_o:           U0BCB   # ோ
  indic_m_o_short:     U0BCA   # ொ
  indic_m_au:          U0BCC   # ௌ
  indic_m_o_candra:    U0BCB
  indic_m_o_candra_alt: U0BCB
  indic_m_r:           U0BBE

  indic_virama:        U0BCD   # ்
  indic_anusvara:      U0B82
  indic_visarga:       U0B83
  indic_candrabindu:   U0B82
  indic_avagraha:      U0B85
  indic_nukta:         U0B85

  # Tamil has no voicing or aspiration in its consonants — k/kh/g/gh
  # all collapse to one letter (க), same for the rest.
  indic_c_ka:          U0B95   # க
  indic_c_kha:         U0B95
  indic_c_ga:          U0B95
  indic_c_gha:         U0B95
