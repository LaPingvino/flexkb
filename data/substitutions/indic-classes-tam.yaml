  indic_c_jha:         U0B9C
  indic_c_nya:         U0B9E   # ஞ
  indic_c_tta:         U0B9F   # ட
  indic_c_ttha:        U0B9F
  indic_c_dda:         U0B9F
  indic_c_ddha:        U0B9F
  indic_c_nna:         U0BA3   # ண
  indic_c_nna_alt:     U0BA9   # ன
  indic_c_ta:          U0BA4   # த
  indic_c_tha:         U0BA4
  indic_c_da:          U0BA4
  indic_c_dha:         U0BA4
