  indic_c_tha:         U0925   # थ
  indic_c_da:          U0926   # द
  indic_c_dha:         U0927   # ध
  indic_c_na:          U0928   # न

  # Labials
  indic_c_pa:          U092A   # प
  indic_c_pha:         U092B   # फ
  indic_c_ba:          U092C   # ब
  indic_c_bha:         U092D   # भ
  indic_c_ma:          U092E   # म

  # Semivowels and sibilants
  indic_c_ya:          U092F   # य
  indic_c_yya:         U095F   # य़
  indic_c_ra:          U0930   # र
  indic_c_rra:         U0931   # ऱ
  indic_c_la:          U0932   # ल
