  indic_c_ha:          U0939   # ह

  # Digits
  indic_digit_0:       U0966   # ०
  indic_digit_1:       U0967   # १
  indic_digit_2:       U0968   # २
  indic_digit_3:       U0969   # ३
  indic_digit_4:       U096A   # ४
  indic_digit_5:       U096B   # ५
  indic_digit_6:       U096C   # ६
  indic_digit_7:       U096D   # ७
  indic_digit_8:       U096E   # ८
  indic_digit_9:       U096F   # ९
