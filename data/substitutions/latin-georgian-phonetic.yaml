name: Latin → Georgian (phonetic)
description: |
  Phonetic Georgian substitution mapping Latin letters to their Mkhedruli
  cognates. Georgian has no upper/lowercase distinction in modern usage,
  so the same letter is used for both levels of the underlying Latin.
