name: Latin → Khmer (phonetic)
description: |
  Phonetic Khmer substitution. Khmer (U1780-U17FF) has a rich consonant
  inventory with two series ("light" / "heavy" vowels). This mapping
  picks the most common cognate per letter; full Khmer typing needs an
  IME for the subscript-consonant clusters.
