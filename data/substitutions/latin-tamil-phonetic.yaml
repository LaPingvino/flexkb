name: Latin → Tamil (phonetic)
description: |
  Phonetic Tamil substitution. Tamil has fewer consonants than Devanagari
  (no voicing distinctions; ka/ga/kha/gha all map to க). Vowels are
  distinct. Apply on any Latin transformation for phonetic Tamil typing;
  real syllabic input needs an IME.
