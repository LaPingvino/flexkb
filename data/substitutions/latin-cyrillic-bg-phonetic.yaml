name: Latin → Cyrillic (Bulgarian phonetic)
description: |
  Bulgarian phonetic substitution. Mostly the same Cyrillic letters as
  Russian phonetic, except: Bulgarian doesn't use ё, ы, ъ as positionally,
  and some shifted assignments differ. This file keeps the substitution
  identical to Russian for shared letters and lets the Bulgarian-specific
  addition handle the rest. Showcases how the same mechanism reuses across
  closely related scripts — almost zero duplication.
