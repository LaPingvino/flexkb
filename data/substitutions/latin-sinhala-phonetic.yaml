name: Latin → Sinhala (phonetic)
description: |
  Phonetic Sinhala substitution for Sri Lankan typing. Sinhala uses the
  Indic Brahmic family with its own codepoints (U0D80-U0DFF). Maps the
  closest consonant/vowel cognate per letter; real syllabic input needs
  an IME.
