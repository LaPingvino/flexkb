  A: U0D86   # ආ
  b: U0DB6   # බ
  B: U0DB7   # භ
  c: U0DA0   # ච
  C: U0DA1   # ඡ
  d: U0DAF   # ද
  D: U0DB0   # ධ
  e: U0D91   # එ
  E: U0D92   # ඒ
