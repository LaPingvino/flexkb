  G: U0D9D   # ඝ
  h: U0DC4   # හ
  H: U0DC4
  i: U0D89   # ඉ
  I: U0D8A   # ඊ
  j: U0DA2   # ජ
  J: U0DA3   # ඣ
  k: U0D9A   # ක
  K: U0D9B   # ඛ
  l: U0DBD   # ල
