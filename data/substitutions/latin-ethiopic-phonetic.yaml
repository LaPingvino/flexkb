name: Latin → Ge'ez/Ethiopic (phonetic, first-order syllables)
description: |
  Phonetic Ge'ez substitution for Tigrinya, Amharic, and Tigre. Ge'ez
  is a syllabary — each character is one consonant+vowel syllable, with
  7 vowel orders per consonant (ä, u, i, a, e, ə, o). This substitution
  provides the FIRST-ORDER (ä-vowel) forms; for full vowel access, pair
  with an IME like ibus-libpinyin or ibus-m17n (m17n-am-sera, m17n-ti).

  Codepoints in the Ethiopic block (U1200-U137F). The mapping picks the
  closest sound cognate per Latin letter.
