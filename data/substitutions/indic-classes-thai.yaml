name: Indic class tokens → Thai codepoints
description: |
  Thai resolution for the InScript template. Thai descended from a
  Brahmic script (via Khmer / Pallava) so consonant categories carry
  over even though the modern Thai keyboard (Kedmanee) uses a different
  layout. This variant exposes Thai through InScript positions, which
  is useful for InScript-trained typists who need to enter Thai.

  Native Thai users should prefer the Kedmanee transformation
  (th/basic) which matches Thai-labelled hardware.

  Notes:
  - Thai has TWO "kha" letters (high/low tone class); we use the more
    common one (ข, U0E02) for indic_c_kha and ฃ (U0E03) for indic_c_chha
    so both are accessible.
  - Thai doesn't use virama-style clustering — its analogue is the
    pinthu (U0E3A), which we map to indic_virama.
map:
  indic_v_a:           U0E2D   # อ (alef carrier)
  indic_v_aa:          U0E32   # า
  indic_v_i:           U0E34   # ิ
  indic_v_ii:          U0E35   # ี
  indic_v_u:           U0E38   # ุ
  indic_v_uu:          U0E39   # ู
  indic_v_e:           U0E40   # เ
  indic_v_e_short:     U0E40
  indic_v_ai:          U0E44   # ไ
  indic_v_o:           U0E42   # โ
  indic_v_o_short:     U0E42
  indic_v_au:          U0E40   # composed
  indic_v_r:           U0E24   # ฤ
  indic_v_l:           U0E26   # ฦ
  indic_v_candra_e:    U0E40
  indic_v_candra_e_alt: U0E40
  indic_v_o_candra:    U0E42

  indic_m_aa:          U0E32
  indic_m_i:           U0E34
  indic_m_ii:          U0E35
  indic_m_u:           U0E38
  indic_m_uu:          U0E39
  indic_m_r:           U0E24
  indic_m_e:           U0E40
  indic_m_e_short:     U0E40
  indic_m_ai:          U0E44
  indic_m_o:           U0E42
