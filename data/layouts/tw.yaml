file: tw
variants:
  - name: basic
    description: Taiwanese (bare QWERTY for Zhuyin/Cangjie IME)
    physical: iso
    transformation: qwerty
    default: true

  - name: indigenous
    description: Taiwanese indigenous languages (QWERTY + intl + Latin extras)
    physical: iso
    transformation: qwerty
    additions: [intl, african-latin-extras]

  - name: dvorak
    description: Taiwanese (Dvorak base for IME)
    physical: iso
    transformation: dvorak

  # Native Da-Chen positional Bopomofo (standard Taiwanese keyboard).
  - name: bopomofo-dachen
    description: Bopomofo / Zhuyin (Da-Chen positional, standard Taiwanese)
    physical: iso
    transformation: bopomofo-dachen

  # Pinyin-phonetic Bopomofo: each Latin letter key carries multiple
  # Bopomofo symbols phonetically related to that letter (Bopomofo has
  # no case so all 4 levels of each key are usable). a → ㄚ at level 1,
  # ㄞ ai at level 2 (Shift), ㄠ ao at level 3 (AltGr), ㄢ an at level 4.
  # zh/ch/sh on Shift+z/c/s.
  - name: bopomofo-pinyin
    description: Bopomofo (Pinyin-phonetic, compounds on shift/AltGr levels)
    physical: iso
    transformation: qwerty
    additions: [bopomofo-pinyin-letter-overlay]

