file: gr
variants:
  - name: basic
    description: Greek (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-greek-phonetic]
    additions: [greek-phonetic-extras]
    default: true

  # Free combinations:
  - name: dvorak
    description: Greek (phonetic, Dvorak base)
    physical: iso
    transformation: dvorak
    substitutions: [latin-greek-phonetic]
    additions: [greek-phonetic-extras]

  - name: colemak
    description: Greek (phonetic, Colemak base)
    physical: iso
    transformation: colemak
    substitutions: [latin-greek-phonetic]
    additions: [greek-phonetic-extras]

  # Coptic via chained substitution: latin → greek → coptic. Demonstrates
  # the substitution-chain mechanism for cross-script pivots. The 6
  # Demotic-derived Coptic letters (ϣ ϥ ϧ ϩ ϫ ϭ ϯ) aren't included —
  # they'd need an additional substitution.
  - name: coptic
    description: Coptic (chained — Latin phonetic → Greek → Coptic)
    physical: iso
    transformation: qwerty
    substitutions: [latin-greek-phonetic, greek-to-coptic]
