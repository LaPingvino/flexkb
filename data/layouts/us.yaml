file: us
variants:
  - name: basic
    description: English (US)
    physical: ansi
    transformation: qwerty
    default: true

  - name: intl
    description: English (US, intl., with dead keys)
    physical: ansi
    transformation: qwerty
    additions: [intl]

  - name: dvorak
    description: English (Dvorak)
    physical: ansi
    transformation: dvorak

  - name: colemak
    description: English (Colemak)
    physical: ansi
    transformation: colemak

  - name: workman
    description: English (Workman)
    physical: ansi
    transformation: workman

  - name: euro
    description: English (US, euro on 5)
    physical: ansi
    transformation: qwerty
    additions: [eurosign-5]

  - name: norman
    description: English (Norman)
    physical: ansi
    transformation: norman

  # Modular dvorak-intl — same `intl` addition as us(intl) but on Dvorak
  # base. Letter-following overlays mean the accented forms track each
  # letter's Dvorak position automatically.
  - name: dvorak-intl
    description: English (Dvorak, intl., with dead keys)
    physical: ansi
    transformation: dvorak
    additions: [intl]

  - name: colemak-intl
    description: English (Colemak, intl., with dead keys)
    physical: ansi
    transformation: colemak
    additions: [intl]

  - name: workman-intl
    description: English (Workman, intl., with dead keys)
    physical: ansi
    transformation: workman
    additions: [intl]

  - name: norman-intl
    description: English (Norman, intl., with dead keys)
    physical: ansi
    transformation: norman
    additions: [intl]
