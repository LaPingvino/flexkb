file: ara
variants:
  - name: basic
    description: Arabic
    physical: iso
    transformation: arabic-101
    default: true

  - name: phonetic
    description: Arabic (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-arabic-phonetic]

  - name: phonetic-dvorak
    description: Arabic (phonetic, Dvorak base)
    physical: iso
    transformation: dvorak
    substitutions: [latin-arabic-phonetic]

  - name: phonetic-colemak
    description: Arabic (phonetic, Colemak base)
    physical: iso
    transformation: colemak
    substitutions: [latin-arabic-phonetic]

  - name: tifinagh-phonetic
    description: Tamazight/Berber (Tifinagh phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-tifinagh-phonetic]

  - name: tifinagh-phonetic-dvorak
    description: Tamazight/Berber (Tifinagh phonetic, Dvorak base)
    physical: iso
    transformation: dvorak
    substitutions: [latin-tifinagh-phonetic]

  - name: braille-output
    description: Arabic Braille glyph output (Latin phonetic → Arabic → Braille)
    physical: iso
    transformation: qwerty
    substitutions: [latin-arabic-phonetic, arabic-to-arabic-braille]
