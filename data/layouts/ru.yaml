file: ru
variants:
  # "winkeys" matches the xkb default variant name; flexkb's modular form
  # is simply the ЙЦУКЕН transformation on an ISO physical.
  - name: winkeys
    description: Russian
    physical: iso
    transformation: ycuken
    default: true

  - name: phonetic
    description: Russian (phonetic, on QWERTY base)
    physical: ansi
    transformation: qwerty
    substitutions: [latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  # The N×M×K kicks in here: Dvorak and Colemak Russian phonetic come
  # for free from the same substitution + extras stack.
  - name: phonetic-dvorak
    description: Russian (phonetic, on Dvorak base)
    physical: ansi
    transformation: dvorak
    substitutions: [latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  - name: phonetic-colemak
    description: Russian (phonetic, on Colemak base)
    physical: ansi
    transformation: colemak
    substitutions: [latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  - name: phonetic-workman
    description: Russian (phonetic, on Workman base)
    physical: ansi
    transformation: workman
    substitutions: [latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  - name: phonetic-norman
    description: Russian (phonetic, on Norman base)
    physical: ansi
    transformation: norman
    substitutions: [latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  # Demonstrates a hotfix substitution: list narrow overrides BEFORE the
  # broad substitution so they pre-empt it. Here, w produces ж instead of
  # colliding with v on в.
  - name: phonetic-w-zhe
    description: Russian (phonetic, QWERTY, w as ж)
    physical: ansi
    transformation: qwerty
    substitutions: [hotfix-russian-w-as-zhe, latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  # Multiple hotfixes chain: q→щ AND w→ж, both pre-empting the broad map.
  - name: phonetic-q-shcha-w-zhe
    description: Russian (phonetic, QWERTY, q as щ + w as ж)
    physical: ansi
    transformation: qwerty
    substitutions: [hotfix-russian-q-as-shcha, hotfix-russian-w-as-zhe, latin-cyrillic-phonetic]
    additions: [russian-phonetic-extras]

  # Inverse: take Russian ЙЦУКЕН muscle memory and produce Latin text.
  - name: latin-via-ycuken
    description: Latin via ЙЦУКЕН positions (inverse phonetic)
    physical: iso
    transformation: ycuken
    substitutions: [~latin-cyrillic-phonetic]

  # Russian + Ukrainian — AltGr unlocks і/ї/є/ґ on the underlying Cyrillic
  # cognate keys without leaving the Russian layout.
  - name: with-ukrainian
    description: Russian + Ukrainian extras
    physical: iso
    transformation: ycuken
    additions: [ukrainian-extras]

  - name: with-belarusian
    description: Russian + Belarusian ў
    physical: iso
    transformation: ycuken
    additions: [belarusian-extras]

  - name: with-ukrainian-belarusian
    description: Russian + Ukrainian + Belarusian
    physical: iso
    transformation: ycuken
    additions: [ukrainian-extras, belarusian-extras]
