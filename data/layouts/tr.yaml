file: tr
variants:
  - name: basic
    description: Turkish (Q)
    physical: iso
    transformation: turkish-q
    default: true

  - name: f
    description: Turkish (F)
    physical: iso
    transformation: turkish-f

  # For users who prefer QWERTY base but want Turkish-style i/İ casing
  # without the full Turkish-Q layout rearrangement.
  - name: us-qwerty-tr-i
    description: Turkish (QWERTY base, Turkish i↔İ pairing)
    physical: iso
    transformation: qwerty
    additions: [turkish-i-pair]

  # The other direction: a Turkish-Q typist wanting ASCII iI casing for
  # entering English/code without leaving the Turkish layout.
  - name: q-ascii-i
    description: Turkish (Q, with ASCII i/I instead of i/İ)
    physical: iso
    transformation: turkish-q
    additions: [english-i-on-turkish]

  - name: f-ascii-i
    description: Turkish (F, with ASCII i/I instead of i/İ)
    physical: iso
    transformation: turkish-f
    additions: [english-i-on-turkish]
