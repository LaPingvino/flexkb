file: th
variants:
  - name: basic
    description: Thai (Kedmanee)
    physical: iso
    transformation: kedmanee
    default: true

  - name: phonetic
    description: Thai (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-thai-phonetic]

  - name: phonetic-dvorak
    description: Thai (phonetic, Dvorak base)
    physical: iso
    transformation: dvorak
    substitutions: [latin-thai-phonetic]

  - name: phonetic-colemak
    description: Thai (phonetic, Colemak base)
    physical: iso
    transformation: colemak
    substitutions: [latin-thai-phonetic]

  # InScript-compatible alternative: same positional template as the
  # Indic scripts. Thai descended from a Brahmic script so the
  # consonant classes map cleanly, though native Thai users should
  # prefer Kedmanee.
  - name: inscript
    description: Thai (InScript positional, alternative to Kedmanee)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-thai]
