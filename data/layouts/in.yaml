file: in
variants:
  # InScript is India's standard keyboard layout (Government-of-India
  # standard since 1986). Same physical positions across every Indic
  # script; per-script codepoint tables resolve the shared template to
  # actual glyphs. ONE transformation file + N codepoint substitutions
  # rather than N hand-written InScript files.
  #
  # InScript variants come FIRST because they're the standard; phonetic
  # variants are listed below as personal-preference alternatives.
  - name: basic
    description: Hindi (Devanagari InScript) — India's standard layout
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-deva]
    default: true

  - name: ben
    description: Bengali (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-ben]

  - name: tam
    description: Tamil (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-tam]

  - name: tel
    description: Telugu (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-tel]

  - name: kan
    description: Kannada (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-kan]

  - name: mal
    description: Malayalam (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-mal]

  - name: guj
    description: Gujarati (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-guj]

  - name: guru
    description: Punjabi / Gurmukhi (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-gur]

  - name: ori
    description: Oriya / Odia (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-ori]

  # The remaining 3 InScript-supported scripts (per BIS IS 13194).
  # Sinhala fits the template directly; Assamese is Bengali + 2 extras
  # via chained substitution; Sindhi-Devanagari is Devanagari + nukta
  # extras the same way.
  - name: sin
    description: Sinhala (InScript)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-sin]

  - name: asm
    description: Assamese (InScript, Bengali script + Assamese ra/wa)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-ben, bengali-to-assamese]

  - name: snd
    description: Sindhi (Devanagari InScript + nukta consonants)
    physical: iso
    transformation: inscript
    substitutions: [indic-classes-deva, deva-to-sindhi]

  # Phonetic variants — Latin transliteration over QWERTY. A different
  # mental model from InScript (typists who don't know InScript can use
  # these). These can be customised further per user — drop a file in
  # ~/.config/flexkb/data/substitutions/ to override.
  - name: hindi-phonetic
    description: Hindi (Devanagari phonetic, QWERTY base — alternate to InScript)
    physical: iso
    transformation: qwerty
    substitutions: [latin-devanagari-phonetic]
    compose: [latin-devanagari-phonetic]

  - name: hindi-phonetic-dvorak
    description: Hindi (Devanagari phonetic, Dvorak base)
    physical: iso
    transformation: dvorak
    substitutions: [latin-devanagari-phonetic]
    compose: [latin-devanagari-phonetic]

  - name: hindi-phonetic-colemak
    description: Hindi (Devanagari phonetic, Colemak base)
    physical: iso
    transformation: colemak
    substitutions: [latin-devanagari-phonetic]
    compose: [latin-devanagari-phonetic]

  - name: tamil-phonetic
    description: Tamil (phonetic, QWERTY base — alternate to InScript)
    physical: iso
    transformation: qwerty
    substitutions: [latin-tamil-phonetic]

  - name: telugu-phonetic
    description: Telugu (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-telugu-phonetic]

  - name: kannada-phonetic
    description: Kannada (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-kannada-phonetic]

  - name: malayalam-phonetic
    description: Malayalam (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-malayalam-phonetic]

  - name: gujarati-phonetic
    description: Gujarati (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-gujarati-phonetic]

  - name: gurmukhi-phonetic
    description: Punjabi / Gurmukhi (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-gurmukhi-phonetic]

  - name: oriya-phonetic
    description: Oriya / Odia (phonetic, QWERTY base)
    physical: iso
    transformation: qwerty
    substitutions: [latin-oriya-phonetic]
